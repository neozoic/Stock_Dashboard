name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python 语法检查
        run: |
          for f in *.py tools/*.py; do
            python -m py_compile "$f" || exit 1
          done
          echo "✓ 全部 Python 文件语法通过"

      - name: JS 语法检查
        run: |
          for f in mock_data.js; do
            node --check "$f" || exit 1
          done
          echo "✓ JS 语法通过"

      - name: 确认没有凭证入库
        run: |
          # .env.example / .env.template 是模板（无敏感信息），不视为泄露
          if git ls-files | grep -E '^\.env$|^\.env\.[a-z]' | grep -vE '\.(example|template)$' | grep -q .; then
            echo "❌ 检测到 .env 被跟踪"
            exit 1
          fi
          echo "✓ 无 .env 被跟踪"

      - name: 确认模板里没有真密钥
        run: |
          # .env.example 是公开仓库里的模板 —— 里面的 secret 必须是空的，
          # 否则谁手滑填一次就等于把飞书 app_secret 推给了全世界
          if grep -E '^FEISHU_APP_SECRET=.+' .env.example >/dev/null 2>&1; then
            echo "❌ .env.example 里的 FEISHU_APP_SECRET 不是空值"
            exit 1
          fi
          if grep -E '^STOCK_FLOW_FEISHU_WEBHOOK=.+' .env.example >/dev/null 2>&1; then
            echo "❌ .env.example 里的 STOCK_FLOW_FEISHU_WEBHOOK 不是空值"
            exit 1
          fi
          echo "✓ 模板里没有真密钥"
