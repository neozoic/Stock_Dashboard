<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>综合选股</title>
<link rel="stylesheet" href="common.css">
<script src="echarts.min.js"></script>
<style>
  .wrap { padding: 22px 18px 40px; max-width: 1400px; margin: 0 auto; }
  .sec-title {
    font-size: 11px; color: var(--muted); letter-spacing: .16em;
    text-transform: uppercase; margin: 18px 0 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03), 0 6px 18px rgba(0, 0, 0, .22);
  }
  .card h2 {
    font-size: 13px; font-weight: 600; letter-spacing: .05em;
    color: var(--text);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding-left: 10px; position: relative;
    margin: 0 0 8px;
  }
  .card h2::before {
    content: ""; position: absolute; left: 0; top: 2px; bottom: 2px;
    width: 3px; border-radius: 2px; background: var(--accent);
  }
  .card h2 .meta {
    font-size: 10px; color: var(--muted); font-weight: normal;
    letter-spacing: 0; text-align: right;
  }
  /* ============ 当前多/空区间徽章(醒目) ============ */
  .band-badge {
    display: inline-flex; align-items: center; gap: 7px;
    margin-left: auto; margin-right: 10px;
    padding: 5px 14px; border-radius: 999px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .04em;
    white-space: nowrap;
    border: 1px solid transparent;
    transition: background .2s ease, color .2s ease;
  }
  .band-badge .bdot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; flex: none;
  }
  .band-badge .bsub {
    font-weight: 500; font-size: 11px; opacity: .9; letter-spacing: 0;
  }
  .band-badge.is-long {
    color: var(--up-soft);
    background: var(--up-bg);
    border-color: rgba(246, 70, 93, .38);
  }
  .band-badge.is-short {
    color: var(--down-soft);
    background: var(--down-bg);
    border-color: rgba(46, 189, 133, .38);
  }
  .band-badge.is-unknown {
    color: var(--muted); background: rgba(255, 255, 255, .04);
    border-color: var(--border);
  }
  .band-badge.is-long .bdot { animation: badgeBreath 2.4s ease-in-out infinite; }
  @keyframes badgeBreath {
    0%, 100% { box-shadow: 0 0 0 0 rgba(246, 70, 93, .5); }
    50% { box-shadow: 0 0 0 5px rgba(246, 70, 93, 0); }
  }
  /* ============ 明细条 ============ */
  .ov-stats {
    display: flex; gap: 26px; flex-wrap: wrap;
    margin: 0 0 12px 10px;
    padding: 9px 14px; border-radius: 9px;
    background: rgba(255, 255, 255, .022);
    border: 1px solid var(--border);
  }
  .ov-stat { display: flex; flex-direction: column; gap: 3px; min-width: 62px; }
  .ov-stat .k { font-size: 10px; color: var(--muted); letter-spacing: .04em; }
  .ov-stat .v {
    font-size: 13px; color: var(--text); font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ov-stat .v.up { color: var(--up-soft); }
  .ov-stat .v.down { color: var(--down-soft); }
  .ov-stat .v.mute { color: var(--muted); font-weight: 400; }
  .hint {
    font-size: 10.5px; color: var(--muted); font-weight: normal;
    letter-spacing: 0; margin: 0 0 8px 10px; line-height: 1.6;
  }
  .hint b { color: var(--text); font-weight: 600; }
  .hint .tag-long { color: var(--up-soft); font-weight: 600; }
  .hint .tag-short { color: var(--down-soft); font-weight: 600; }
  .ov-controls {
    display: flex; gap: 10px; align-items: center; margin: 0 0 10px 10px; flex-wrap: wrap;
  }
  .ov-controls select {
    background: var(--card-hover); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; font-size: 12px; font-family: inherit;
    cursor: pointer; outline: none;
  }
  .ov-controls select:hover { border-color: var(--border-hover); }
  .ov-note { font-size: 11px; color: var(--muted); }
  /* K线 + 成交量 + MACD + KDJ 四个区，460px 太挤 */
  .chart-box { width: 100%; height: 620px; }
  .placeholder {
    border: 1px dashed var(--border-hover); border-radius: var(--radius);
    padding: 44px 24px; text-align: center; color: var(--muted);
    font-size: 12.5px; line-height: 1.9;
    background: rgba(255, 255, 255, .012);
  }
  .placeholder b { color: var(--text); font-weight: 600; }
  .topnav { display: inline-flex; gap: 12px; align-items: center; }
  .topnav-link {
    font-size: 11.5px; color: var(--muted); text-decoration: none;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: rgba(255, 255, 255, .03);
    transition: color .16s ease, border-color .16s ease;
  }
  .topnav-link:hover { color: var(--text); border-color: var(--border-hover); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo"></span>
    <h1>综合选股</h1>
    <span class="brand-sub">Stock Selection</span>
  </div>
  <div class="status">
    <nav class="topnav">
      <a class="topnav-link" href="/">首页</a>
      <a class="topnav-link" href="/fund">资金流看板</a>
    </nav>
    <span class="clock-group" title="北京时间 (UTC+8)">
      <span class="clock-state" id="cn-state"><span class="dot"></span><span class="state-text">CN 检测中</span></span>
      <span class="clock-col">
        <span class="clock-time">CN <span id="bj">--:--:--</span></span>

      <span class="clock-col">
        <span class="clock-time">US <span id="ny">--:--:--</span></span>
        <span class="clock-countdown" id="us-open">距开盘 --</span>
      </span>
    </span>
  </div>
</header>

<main class="wrap">
  <div class="sec-title">大盘概览</div>
  <div class="card">
    <h2>指数 K 线
      <span class="band-badge is-unknown" id="ov-band-badge">
        <span class="bdot"></span><span class="blabel">区间未知</span><span class="bsub"></span>
      </span>
      <span class="meta" id="ov-meta">加载中…</span>
    </h2>
    <p class="hint">
      K 线背景色标示 0AMV「活跃市值」的多/空头区间：
      <span class="tag-long">淡红 = 多头区间</span>（当日涨幅 ≥ +4% 或连续 2 日加和 ≥ +4%）·
      <span class="tag-short">淡绿 = 空头波段</span>（当日跌幅 ≤ -2.3%）
    </p>
    <div class="ov-controls">
      <select id="ov-index">
        <option value="000001.SH">上证指数</option>
        <option value="399006.SZ">创业板指</option>
      </select>
      <select id="ov-period">
        <option value="day" selected>日 K</option>
        <option value="week">周 K</option>
        <option value="month">月 K</option>
        <option value="year">年 K</option>
      </select>
      <span class="ov-note" id="ov-note"></span>
    </div>
    <div class="ov-stats" id="ov-stats"></div>
    <div id="ov-chart" class="chart-box"></div>
  </div>

  <div class="sec-title">综合选股</div>
  <div class="placeholder">
    <b>布局稍后设计</b><br>
    开盘时间指示器（距 A 股 / 美股开盘倒计时）已在顶部就位。
  </div>
</main>

<script src="clock.js"></script>
<script>
(function () {
  "use strict";

  // 空头=淡绿 / 多头=淡红（A股习惯：绿跌红涨）
  // 透明度要很低 —— 区间可能连续覆盖几百根K线，颜色一深整张图就糊了
  var COLOR_SHORT = "rgba(46, 189, 133, .075)";   // --down
  var COLOR_LONG = "rgba(246, 70, 93, .075)";     // --up
  // 当前区间用更深的色 + 边框，一眼定位
  var COLOR_SHORT_STRONG = "rgba(46, 189, 133, .20)";
  var COLOR_LONG_STRONG = "rgba(246, 70, 93, .20)";
  var COLOR_UP = "#f6465d";
  var COLOR_DOWN = "#2ebd85";
  var COLOR_MUTED = "#8b94a7";
  var COLOR_AXIS = "rgba(255,255,255,.08)";

  var chart = null;
  var bands = [];       // 0AMV 多/空头区间
  var state = null;     // 当前区间状态
  var latest = null;    // 最新一天的 活跃/死筹/活跃占比
  var stateDays = null; // 当前区间已持续几个交易日
  var dailyMap = null;  // 日期 -> {close, chg}  0AMV 全量日线
  // K 线自己的元信息 —— 大盘概览这张卡同时画 0AMV 区间和指数 K 线，
  // 两个数据源不同步（0AMV 每天 20:00 更新，K 线走通达信本地日线，盘后才下载），
  // 以前混用同一个"数据截至"，看起来就像 K 线少了当天那一根
  var klineMeta = { dataDate: null, patched: false };
  var bandMap = null;   // 日期 -> 区间类型（多头区间/空头波段）
  var cur = { code: "000001.SH", period: "day" };

  function fmtDate(yyyymmdd) {
    var s = String(yyyymmdd || "");
    if (s.length !== 8) return "";
    return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8);
  }

  function fmtPct(x, digits) {
    if (x === null || x === undefined || isNaN(x)) return "--";
    return (x >= 0 ? "+" : "") + Number(x).toFixed(digits === undefined ? 2 : digits) + "%";
  }

  function clsFor(x) { return x > 0 ? "up" : (x < 0 ? "down" : "mute"); }

  function fmtNum(x) {
    if (x === null || x === undefined || isNaN(x)) return "--";
    return Number(x).toFixed(2);
  }

  // 建立 日期->{close, chg} 与 日期->区间类型 两张查表
  function buildLookups(daily, bandList) {
    var dm = {};
    if (daily && daily.length) {
      for (var i = 0; i < daily.length; i++) {
        var d = daily[i];
        dm[String(d[0]).replace(/-/g, "")] = { close: d[1], chg: d[2] };
      }
    }
    var bm = {};
    if (bandList && bandList.length) {
      for (var j = 0; j < bandList.length; j++) {
        var b = bandList[j];
        var s = String(b.start).replace(/-/g, "");
        var e = String(b.end || b.start).replace(/-/g, "");
        // 区间可能很长，遍历写入；8250 天 × 650 段的最坏情况也不到百万次
        for (var dnum = s; dnum <= e; dnum = nextDateStr(dnum)) {
          bm[dnum] = b.type;
          if (dnum === e) break;
        }
      }
    }
    dailyMap = dm;
    bandMap = bm;
  }

  // YYYYMMDD -> 下一天（纯字符串进位，避开 datetime）
  function nextDateStr(s) {
    var y = parseInt(s.slice(0, 4), 10);
    var m = parseInt(s.slice(4, 6), 10);
    var d = parseInt(s.slice(6, 8), 10);
    var days = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    if ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) days[1] = 29;
    d += 1;
    if (d > days[m - 1]) { d = 1; m += 1; }
    if (m > 12) { m = 1; y += 1; }
    var p2 = function (v) { return (v < 10 ? "0" : "") + v; };
    return String(y) + p2(m) + p2(d);
  }

  // 取某根K线对应的 0AMV 涨跌幅
  //   日K   -> 当天的日涨跌幅
  //   周/月/年 -> 该周期内 0AMV 的累计涨跌幅（用日线收盘复利）
  function oamvChangeFor(dates, idx) {
    if (!dailyMap || !dates.length) return null;
    var d = String(dates[idx] || "").replace(/-/g, "");
    if (idx === 0 || cur.period === "day") {
      var e = dailyMap[d];
      return e ? e.chg : null;
    }
    // 粗粒度：从上一根K线的次日 到 本根K线当天，0AMV 收盘的累计变化
    var prev = String(dates[idx - 1] || "").replace(/-/g, "");
    var from = dailyMap[prev];
    var to = dailyMap[d];
    if (!from || !to || !from.close || !to.close) return null;
    return (to.close / from.close - 1) * 100;
  }

  // 把区间起止日映射到 K 线的**类别索引**。
  //
  // 为什么不用 xAxis: "2026-11-06" 这种类别值定位 markArea：
  //   0AMV 数据与指数 K 线的日期常常对不上（651 段里有 586 段起止日不在 K 线类别值上），
  //   类别值匹配不上时 ECharts 会画到错误位置，整张图糊成一片。
  //   改用「类别索引」定位（xAxisIndex 数值），配合 xAxis type=category，
  //   区间块一定落在两根真实 K 线之间。
  // 每根 bar 的"周期起点回溯天数" —— 判断区间是否与该 bar 重叠时用。
  //   周K 的 bar 日期是该周**最后**交易日，月K/年K 同理；
  //   所以短区间（如只到周三）在周K 上直接用 bar 日期比较会整个丢掉，
  //   必须按"周期有重叠就算"来判定。
  // ============ 技术指标（前端就地计算，不额外发请求） ============
  // EMA：遇到 null 跳过（MACD 的 DIF 序列开头是 null）
  function emaWithNull(arr, n) {
    var k = 2 / (n + 1), out = [], prev = null;
    for (var i = 0; i < arr.length; i++) {
      var v = arr[i];
      if (v === null || v === undefined || !isFinite(v)) { out.push(null); continue; }
      prev = (prev === null) ? v : (v * k + prev * (1 - k));
      out.push(prev);
    }
    return out;
  }

  function r2(v) { return (v === null || !isFinite(v)) ? null : Math.round(v * 100) / 100; }

  // MACD(12,26,9)：DIF = EMA12-EMA26，DEA = EMA9(DIF)，柱 = (DIF-DEA)*2
  function calcMACD(closes, fast, slow, signal) {
    fast = fast || 12; slow = slow || 26; signal = signal || 9;
    var ef = emaWithNull(closes, fast), es = emaWithNull(closes, slow);
    var dif = [], dea, hist = [], i;
    for (i = 0; i < closes.length; i++) {
      dif.push((ef[i] === null || es[i] === null) ? null : ef[i] - es[i]);
    }
    dea = emaWithNull(dif, signal);
    for (i = 0; i < closes.length; i++) {
      hist.push((dif[i] === null || dea[i] === null) ? null : (dif[i] - dea[i]) * 2);
    }
    return { dif: dif, dea: dea, hist: hist };
  }

  // KDJ(9,3,3)：RSV=(C-Ln)/(Hn-Ln)*100，K=SMA(RSV,3,1)，D=SMA(K,3,1)，J=3K-2D
  function calcKDJ(bars, n, m1, m2) {
    n = n || 9; m1 = m1 || 3; m2 = m2 || 3;
    var K = [], D = [], J = [], pk = 50, pd = 50;
    for (var i = 0; i < bars.length; i++) {
      var lo = Infinity, hi = -Infinity;
      for (var j = Math.max(0, i - n + 1); j <= i; j++) {
        var bl = bars[j].low, bh = bars[j].high;
        if (bl !== null && bl !== undefined && bl < lo) lo = bl;
        if (bh !== null && bh !== undefined && bh > hi) hi = bh;
      }
      var rsv = (!isFinite(hi) || hi === lo) ? 50
              : (bars[i].close - lo) / (hi - lo) * 100;
      pk = (rsv + (m1 - 1) * pk) / m1;
      pd = (pk + (m2 - 1) * pd) / m2;
      K.push(r2(pk)); D.push(r2(pd)); J.push(r2(3 * pk - 2 * pd));
    }
    return { K: K, D: D, J: J };
  }

  function periodOffset(period) {
    if (period === "week") return 7;
    if (period === "month") return 32;
    if (period === "year") return 370;
    return 1;   // 日K
  }

  function buildMarkArea(dates, period) {
    if (!dates.length) return [];
    var off = periodOffset(period);
    var first = dates[0].replace(/-/g, "");
    var last = dates[dates.length - 1].replace(/-/g, "");
    var areas = [];
    // 当前区间：画得更醒目（色深一点 + 边框），一眼能看出"现在在哪一段"
    var curBand = currentBand(dates, off, first, last);
    for (var i = 0; i < bands.length; i++) {
      var b = bands[i];
      var st = fmtDate(b.start).replace(/-/g, "");
      var en = fmtDate(b.end).replace(/-/g, "");
      if (!st || !en) continue;
      // 整个区间都在 K 线范围之外 -> 跳过
      //   早于范围：K线2020起，区间可能回溯到1993 —— 不跳过的话会被压成 [0,0]，
      //            650 个区间全堆在图的最左边，整张图糊掉（2026-11-25 踩过）
      if (en < first) continue;
      if (st > last) continue;

      var si = -1, ei = -1;
      for (var j = 0; j < dates.length; j++) {
        var dj = dates[j].replace(/-/g, "");
        // bar 的周期结束日 >= 区间开始 -> 该 bar 覆盖区间开头
        if (si < 0 && dj >= st) si = j;
        // bar 的周期起始日 <= 区间结束 -> 该 bar 与区间有重叠
        if (dj - off <= en) ei = j;
      }
      if (si < 0) continue;
      if (ei < si) ei = si;                  // 区间末尾超出K线 -> 至少留一根
      var isCur = curBand && si === curBand[0] && ei === curBand[1];
      var base = b.type === "空头波段" ? COLOR_SHORT : COLOR_LONG;
      // 当前区间用更深的填充色，但**不画边框**：区间很短时（比如只有 1~2 天）
      // 边框是一条贯穿整个 grid 高度的竖线，跟 K 线的长影线长得一模一样
      // —— 用户以为 K 线画错了（2026-11-26 实测踩到）
      var fill = isCur
        ? (b.type === "空头波段" ? COLOR_SHORT_STRONG : COLOR_LONG_STRONG)
        : base;
      // 用 ±0.5 覆盖整根 bar：类别轴下索引 i 表示第 i 根 bar 的**中心**，
      // 只画 [si, ei] 时单日区间宽度为 0 —— 完全看不见。
      // 当前多头区间只有 2026-11-27 一天，背景色带因此消失（实测踩到）
      areas.push([
        { xAxis: si - 0.5, itemStyle: { color: fill } },
        { xAxis: ei + 0.5 }
      ]);
    }
    return areas;
  }

  // 找出"当前"所处的区间在 K 线上的索引范围
  function currentBand(dates, off, first, last) {
    if (!state || !state.type || !dates.length) return null;
    var st = fmtDate(state.start).replace(/-/g, "");
    var en = fmtDate(state.end || state.start).replace(/-/g, "");
    if (!st) return null;
    var si = -1, ei = -1;
    for (var j = 0; j < dates.length; j++) {
      var dj = dates[j].replace(/-/g, "");
      if (si < 0 && dj >= st) si = j;
      if (dj - off <= en) ei = j;
    }
    if (si < 0) return null;
    if (ei < si) ei = si;
    return [si, ei];
  }

  function render(bars, name, period) {
    var realDates = bars.map(function (b) { return b.date; });
    // 区间色带要用**真实日期**算（末尾补的空位会让 last 变成空串）
    var areas = buildMarkArea(realDates, period || cur.period);

    // 末尾补 1 个空类目：
    //   ① 拖到最右时最后一根 K 线不贴边，右侧有留白
    //   ② 更重要 —— 类别轴的 xAxis 上限是 (n-0.5)。markArea 要画到
    //      最后一根右侧就得用 ei+0.5，正好越界被 ECharts 整个丢弃，
    //      于是"只有一天的多头区间"背景完全看不见（2026-11-27 实测踩到）
    //      补一个空位后上限变成 n+0.5，ei+0.5 就落在范围内了
    var dates = realDates.concat([""]);
    var kdata = bars.map(function (b) { return [b.open, b.close, b.low, b.high]; }).concat(["-"]);
    var vdata = bars.map(function (b) { return b.volume; }).concat([null]);

    // MACD / KDJ：用真实 bars 算，末尾同样补 null 对齐空位
    var closes = bars.map(function (b) { return b.close; });
    var macd = calcMACD(closes);
    var kdj = calcKDJ(bars);
    macd.dif.push(null); macd.dea.push(null); macd.hist.push(null);
    kdj.K.push(null); kdj.D.push(null); kdj.J.push(null);

    var opt = {
      animation: false,
      backgroundColor: "transparent",
      textStyle: { color: "#e8ecf3", fontSize: 12 },
      tooltip: {
        trigger: "axis",
        axisPointer: { type: "cross" },
        confine: true,
        backgroundColor: "rgba(18, 23, 34, .96)",
        borderColor: "rgba(255,255,255,.1)",
        textStyle: { color: "#e8ecf3", fontSize: 12 },
        extraCssText: "max-width:380px;white-space:normal;box-shadow:0 8px 24px rgba(0,0,0,.45);border-radius:8px;",
        formatter: function (params) {
          if (!params || !params.length) return "";
          // 加了 MACD/KDJ 之后 params 里有多个 series，必须挑出 K 线那一条
          var p = null;
          for (var pi = 0; pi < params.length; pi++) {
            if (params[pi].seriesType === "candlestick") { p = params[pi]; break; }
          }
          if (!p) p = params[0];
          var dateStr = p.axisValue || "";
          // ⚠️ 不要用 p.data：category 轴下 ECharts 会把它变成
          //    [索引, open, close, low, high] 五元组 —— 直接按 4 元组取会整体错位
          //    （实测 tooltip 显示"开 1501.00"，1501 其实是 dataIndex）
          var k = kdata[p.dataIndex] || p.data;
          if (!k || !k.length) return "";
          var idx = p.dataIndex;
          var chg = oamvChangeFor(dates, idx);
          var band = (bandMap && bandMap[String(dateStr).replace(/-/g, "")]) || "";
          // 区间色: 空头=绿, 多头=红 —— 与图上背景色一致
          var bandColor = band === "空头波段" ? COLOR_DOWN
                        : (band === "多头区间" ? COLOR_UP : COLOR_MUTED);
          var bandLabel = band ? ("　" + band) : "";
          var html = '<div style="font-size:11px;color:#8b94a7;margin-bottom:4px">' +
                     dateStr + bandLabel + "</div>";
          html += '<div style="line-height:1.75">开 ' + fmtNum(k[0]) +
                  "　高 " + fmtNum(k[3]) + "<br/>" +
                  "收 " + fmtNum(k[1]) + "　低 " + fmtNum(k[2]) + "</div>";
          if (chg !== null && chg !== undefined) {
            html += '<div style="margin-top:5px;padding-top:5px;' +
                    'border-top:1px solid rgba(255,255,255,.12);color:' + bandColor +
                    ';font-weight:600">0AMV 涨跌 ' + fmtPct(chg) + "</div>";
          }
          // 指标值（与下方副图对应）
          var mv = macd.hist[idx], mdi = macd.dif[idx], mde = macd.dea[idx];
          if (mdi !== null && mdi !== undefined) {
            var mc = (mv >= 0) ? COLOR_UP : COLOR_DOWN;
            html += '<div style="margin-top:5px;padding-top:5px;' +
                    'border-top:1px solid rgba(255,255,255,.12);font-size:11px">' +
                    '<span style="color:#f0b90b">DIF ' + fmtNum(mdi) + "</span>　" +
                    '<span style="color:#4f9cf9">DEA ' + fmtNum(mde) + "</span>　" +
                    '<span style="color:' + mc + '">MACD ' + fmtNum(mv) + "</span></div>";
          }
          var kv = kdj.K[idx], dv = kdj.D[idx], jv = kdj.J[idx];
          if (kv !== null && kv !== undefined) {
            html += '<div style="font-size:11px;margin-top:2px">' +
                    '<span style="color:#ff9f43">K ' + fmtNum(kv) + "</span>　" +
                    '<span style="color:#4f9cf9">D ' + fmtNum(dv) + "</span>　" +
                    '<span style="color:#c678dd">J ' + fmtNum(jv) + "</span></div>";
          }
          return html;
        }
      },
      legend: {
        data: [name, "DIF", "DEA", "K", "D", "J"], top: 0,
        itemWidth: 10, itemHeight: 8, itemGap: 10,
        textStyle: { color: "#c6cdd9", fontSize: 11 }
      },
      grid: [
        // right 留够空间：dataZoom 拖到最右(end=100)时最后一根 K 线贴着边缘，
        // 背景色带会被裁掉一半 —— 留 64px 让它完整显示
        { left: 58, right: 64, top: 24, height: "34%" },     // K 线
        { left: 58, right: 64, top: "43%", height: "10%" },  // 成交量
        { left: 58, right: 64, top: "57%", height: "11%" },  // MACD
        { left: 58, right: 64, top: "72%", height: "11%" }   // KDJ
      ],
      xAxis: [
        { type: "category", data: dates, gridIndex: 0, boundaryGap: true,
          axisLabel: { show: false }, axisLine: { lineStyle: { color: COLOR_AXIS } },
          axisTick: { show: false }, splitLine: { show: false } },
        { type: "category", data: dates, gridIndex: 1, boundaryGap: true,
          axisLabel: { show: false }, axisLine: { lineStyle: { color: COLOR_AXIS } },
          axisTick: { show: false }, splitLine: { show: false } },
        { type: "category", data: dates, gridIndex: 2, boundaryGap: true,
          axisLabel: { show: false }, axisLine: { lineStyle: { color: COLOR_AXIS } },
          axisTick: { show: false }, splitLine: { show: false } },
        // 日期标签放在最下面一格（KDJ）
        { type: "category", data: dates, gridIndex: 3, boundaryGap: true,
          axisLabel: { color: COLOR_MUTED, fontSize: 10 },
          axisLine: { lineStyle: { color: COLOR_AXIS } },
          axisTick: { show: false }, splitLine: { show: false } }
      ],
      yAxis: [
        { scale: true, gridIndex: 0, name: "点位",
          nameTextStyle: { color: COLOR_MUTED, fontSize: 10 },
          axisLabel: { color: COLOR_MUTED, fontSize: 10 },
          splitLine: { lineStyle: { color: COLOR_AXIS } } },
        { scale: true, gridIndex: 1, name: "量", splitNumber: 2,
          nameTextStyle: { color: COLOR_MUTED, fontSize: 10 },
          axisLabel: {
            color: COLOR_MUTED, fontSize: 10,
            // 成交量原始值是 4.5 亿级的整数，直接显示会挤成一串
            formatter: function (v) {
              if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(1) + "亿";
              if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(0) + "万";
              return v;
            }
          },
          splitLine: { show: false } },
        { scale: true, gridIndex: 2, name: "MACD", splitNumber: 2,
          nameTextStyle: { color: COLOR_MUTED, fontSize: 10 },
          axisLabel: { color: COLOR_MUTED, fontSize: 10 },
          splitLine: { show: false } },
        { scale: true, gridIndex: 3, name: "KDJ", splitNumber: 3,
          nameTextStyle: { color: COLOR_MUTED, fontSize: 10 },
          axisLabel: { color: COLOR_MUTED, fontSize: 10 },
          splitLine: { show: false } }
      ],
      dataZoom: [
        { type: "inside", xAxisIndex: [0, 1, 2, 3], start: 60, end: 100 },
        { type: "slider", xAxisIndex: [0, 1, 2, 3], bottom: 4, height: 16,
          borderColor: COLOR_AXIS, backgroundColor: "transparent",
          textStyle: { color: COLOR_MUTED, fontSize: 10 } }
      ],
      series: [
        {
          name: name, type: "candlestick", data: kdata, z: 3,
          itemStyle: { color: COLOR_UP, color0: COLOR_DOWN, borderColor: COLOR_UP, borderColor0: COLOR_DOWN }
        },
        {
          name: "成交量", type: "bar", xAxisIndex: 1, yAxisIndex: 1, data: vdata,
          itemStyle: { color: "rgba(79,156,249,.45)" }
        },
        {
          // 区间背景色独立成一个 series，z 压到 K 线下面（z:3）——
          // 原来 markArea 挂在 candlestick 上，总是画在 K 线**之上**，
          // 窄区间会把最后一两根 K 线糊掉
          name: "区间", type: "line", data: [], z: 1, silent: true,
          xAxisIndex: 0, yAxisIndex: 0, showSymbol: false,
          markArea: { silent: true, data: areas }
        },
        // ---------- MACD ----------
        {
          name: "MACD", type: "bar", xAxisIndex: 2, yAxisIndex: 2, data: macd.hist,
          barMaxWidth: 6,
          itemStyle: {
            color: function (prm) {
              // 正红负绿，与 K 线配色一致（A 股红涨绿跌）
              var v = prm.value;
              return (v === null || v === undefined || v >= 0) ? COLOR_UP : COLOR_DOWN;
            }
          }
        },
        {
          name: "DIF", type: "line", xAxisIndex: 2, yAxisIndex: 2, data: macd.dif,
          showSymbol: false, lineStyle: { width: 1.2, color: "#f0b90b" },
          itemStyle: { color: "#f0b90b" }
        },
        {
          name: "DEA", type: "line", xAxisIndex: 2, yAxisIndex: 2, data: macd.dea,
          showSymbol: false, lineStyle: { width: 1.2, color: "#4f9cf9" },
          itemStyle: { color: "#4f9cf9" }
        },
        // ---------- KDJ ----------
        {
          // K 用橙色 —— 和 MACD 的 DIF(黄) 区分开，否则图例上看不出差别
          name: "K", type: "line", xAxisIndex: 3, yAxisIndex: 3, data: kdj.K,
          showSymbol: false, lineStyle: { width: 1.2, color: "#ff9f43" },
          itemStyle: { color: "#ff9f43" }
        },
        {
          name: "D", type: "line", xAxisIndex: 3, yAxisIndex: 3, data: kdj.D,
          showSymbol: false, lineStyle: { width: 1.2, color: "#4f9cf9" },
          itemStyle: { color: "#4f9cf9" }
        },
        {
          name: "J", type: "line", xAxisIndex: 3, yAxisIndex: 3, data: kdj.J,
          showSymbol: false, lineStyle: { width: 1.2, color: "#c678dd" },
          itemStyle: { color: "#c678dd" }
        }
      ]
    };
    chart.setOption(opt, true);
  }

  function updateMeta(name, n) {
    // K 线自己的截止日期要显式写出来 —— 它是通达信本地日线，
    // 盘后下载完成前会比 0AMV 少一天
    var meta = name + " · " + n + " 根K线";
    if (klineMeta.dataDate) meta += " · 截至 " + klineMeta.dataDate;
    document.getElementById("ov-meta").textContent = meta;
    var note = document.getElementById("ov-note");
    var bits = [];
    bits.push(bands.length ? ("已标注 " + bands.length + " 段多/空区间") : "暂无区间标注");
    if (klineMeta.patched) bits.push("末尾新增K线取自实时源");
    note.textContent = bits.join(" · ");
    renderBadge();
    renderStats();
  }

  // ============ 当前区间徽章（醒目） ============
  function renderBadge() {
    var badge = document.getElementById("ov-band-badge");
    var label = badge.querySelector(".blabel");
    var sub = badge.querySelector(".bsub");
    if (!state || !state.type) {
      badge.className = "band-badge is-unknown";
      label.textContent = "区间未知";
      if (sub) sub.textContent = "";
      return;
    }
    var isLong = state.type === "多头区间";
    badge.className = "band-badge " + (isLong ? "is-long" : "is-short");
    label.textContent = state.type;
    if (sub) {
      var bits = [];
      if (stateDays) bits.push("已 " + stateDays + " 个交易日");
      // 区间刚开启（只有 1 天）时 cum_pct 恒为 0，没信息量 —— 改显示当日涨跌
      if (stateDays && stateDays > 1 && state.cum_pct !== null && state.cum_pct !== undefined) {
        bits.push("区间 " + fmtPct(state.cum_pct));
      } else if (latest && latest.chg !== null && latest.chg !== undefined) {
        bits.push("当日 " + fmtPct(latest.chg));
      }
      sub.textContent = bits.join(" · ");
    }
  }

  // ============ 明细条（决策要看的数） ============
  function renderStats() {
    var box = document.getElementById("ov-stats");
    if (!box) return;
    var items = [];
    function add(k, v, c) { items.push('<div class="ov-stat"><span class="k">' + k +
                                      '</span><span class="v ' + (c || "") + '">' + v + "</span></div>"); }

    if (state && state.type) {
      add("当前区间", state.type, state.type === "多头区间" ? "up" : "down");
      add("起始日", fmtDate(state.start) || "--", "mute");
      if (stateDays) add("持续", stateDays + " 个交易日", "mute");
      // 区间只有 1 天时 cum_pct 恒为 0，显示当日涨跌更有意义
      if (stateDays && stateDays > 1 && state.cum_pct !== null && state.cum_pct !== undefined) {
        add("区间涨跌", fmtPct(state.cum_pct), clsFor(state.cum_pct));
      }
    } else {
      add("当前区间", "未知", "mute");
    }
    if (latest) {
      add("0AMV 活跃市值", (latest.close === null || latest.close === undefined)
          ? "--" : Number(latest.close).toFixed(1) + " 亿", "mute");
      if (latest.chg !== null && latest.chg !== undefined) {
        add("当日涨跌", fmtPct(latest.chg), clsFor(latest.chg));
      }
      if (latest.active_ratio !== null && latest.active_ratio !== undefined) {
        add("活跃占比", (latest.active_ratio * 100).toFixed(2) + "%", "mute");
      }
      // 明确写"0AMV 截至" —— 它和下面 K 线的日期是两个数据源，不能共用一个标签
      add("0AMV 截至", fmtDate(latest.date) || "--", "mute");
    }
    if (klineMeta.dataDate) {
      add("K线截至", klineMeta.dataDate, "mute");
    }
    box.innerHTML = items.join("");
  }

  function load() {
    var url = "/api/index/kline?code=" + encodeURIComponent(cur.code) +
              "&period=" + encodeURIComponent(cur.period);
    document.getElementById("ov-meta").textContent = "加载中…";
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) {
          document.getElementById("ov-meta").textContent = "加载失败：" + (d.message || d.error);
          return;
        }
        klineMeta.dataDate = d.data_date || null;
        klineMeta.patched = !!d.tail_patched;
        render(d.bars || [], d.name || cur.code, d.period || cur.period);
        updateMeta(d.name || cur.code, d.count || 0);
      })
      .catch(function () {
        document.getElementById("ov-meta").textContent = "加载失败";
      });
  }

  function loadBands() {
    return fetch("/api/oamv/bands", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        bands = d.bands || [];
        state = d.state || null;
        latest = d.latest || null;
        stateDays = (d.state_days === null || d.state_days === undefined) ? null : d.state_days;
        buildLookups(d.daily || [], bands);
        load();
      })
      .catch(function () { load(); });
  }

  document.addEventListener("DOMContentLoaded", function () {
    chart = echarts.init(document.getElementById("ov-chart"));
    document.getElementById("ov-index").addEventListener("change", function () {
      cur.code = this.value; load();
    });
    document.getElementById("ov-period").addEventListener("change", function () {
      cur.period = this.value; load();
    });
    window.addEventListener("resize", function () { chart.resize({ silent: true }); });
    loadBands();
  });
})();
</script>
</body>
</html>
